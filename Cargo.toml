[package]
name = "plaintext"
version = "2.11.4"
edition = "2021"
description = "The PlainText programming language — a readability-first language for desktop UIs and 2D games."

[dependencies]
raylib = "5.5"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
ureq = "2"
serde_json = "1"
rustc-hash = "2"
tower-lsp = "0.20"
tokio = { version = "1.53.1", features = ["macros", "io-std", "io-util", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "plaintext"
path = "src/main.rs"

[profile.dev]
# Faster incremental builds while iterating on the interpreter.
opt-level = 0
