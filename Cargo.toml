[package]
name = "plaintext"
version = "2.2.0"
edition = "2021"
description = "The PlainText programming language — a readability-first language for desktop UIs and 2D games."

[dependencies]
raylib = "5.5"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[[bin]]
name = "plaintext"
path = "src/main.rs"

[profile.dev]
# Faster incremental builds while iterating on the interpreter.
opt-level = 0
