name: CI

# Verify Windows + macOS release builds on every push / PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Build release
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
          fi
          cargo build --release

      - name: Check examples
        shell: bash
        run: |
          BIN=./target/release/plaintext
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./target/release/plaintext.exe
          fi
          for f in examples/*.pt; do
            echo "check $f"
            "$BIN" check "$f"
          done
          # Console examples that run to completion (no window, no stdin, no
          # forever-timer). Games/UI (bounce, catch, counter, evolve, watch_learn),
          # ask.pt (stdin) and timers.pt (runs forever) are excluded on purpose.
          for f in basics cart stdlib list_tools classify remember dataset; do
            echo "run examples/$f.pt"
            "$BIN" run "examples/$f.pt"
          done
          # Neural-net smoke tests. learn.pt is pure CPU; gpu_learn.pt asks for a
          # GPU (device: auto) — on the macOS runner that exercises the Metal/MPS
          # path, and everywhere else it falls back to the CPU with a note.
          "$BIN" run examples/learn.pt
          "$BIN" run examples/gpu_learn.pt
