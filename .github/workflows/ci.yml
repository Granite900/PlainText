name: CI

# Verify Windows + macOS (Apple Silicon + Intel) + Linux release builds
# on every push / PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14          # Apple Silicon
          - os: macos-15-intel    # Intel Mac (x86_64)
          - os: ubuntu-latest     # Linux x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Install Linux deps (Raylib / bindgen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libclang-dev clang \
            libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build release
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
          fi
          cargo build --release

      - name: Check examples
        shell: bash
        run: |
          BIN=./target/release/plaintext
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./target/release/plaintext.exe
          fi
          for f in examples/*.pt; do
            echo "check $f"
            "$BIN" check "$f"
          done
          # Console examples that run to completion (no window, no stdin, no
          # forever-timer). Games/UI (catch, platformer, counter, form, evolve),
          # ask.pt (stdin) and timers.pt (runs forever) are excluded on purpose.
          for f in basics stdlib list_tools fetch dataset; do
            echo "run examples/$f.pt"
            "$BIN" run "examples/$f.pt"
          done
          # Neural-net smoke: learn.pt uses device: auto (GPU when available,
          # CPU fallback elsewhere) and exercises save / load_network.
          "$BIN" run examples/learn.pt

      - name: Smoke plaintext build
        shell: bash
        run: |
          BIN=./target/release/plaintext
          EXT=
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=./target/release/plaintext.exe
            EXT=.exe
          fi
          mkdir -p dist-smoke
          "$BIN" build examples/basics.pt -o "dist-smoke/basics-app${EXT}"
          chmod +x "dist-smoke/basics-app${EXT}" 2>/dev/null || true
          "dist-smoke/basics-app${EXT}"
